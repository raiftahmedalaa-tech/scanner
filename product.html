<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>بيانات المنتج</title>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --background: #f3f6fb;
      --surface: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #15803d;
      --danger: #b91c1c;
      --radius: 18px;
      --shadow: 0 12px 35px rgba(15, 23, 42, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .page {
      width: 100%;
      max-width: 620px;
      margin: auto;
      padding: 28px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(226, 232, 240, .9);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .card h2 { font-size: 21px; margin: 0 0 10px; }

    .description {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
      margin: 0 0 22px;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      min-height: 48px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #fff;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      padding: 12px 16px;
      transition: background .2s, transform .1s;
    }

    button:hover { background: var(--primary-dark); }
    button:active { transform: scale(.99); }
    button:disabled { opacity: .6; cursor: not-allowed; }

    .logout-button {
      background: #fff;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .logout-button:hover { background: #fef2f2; }

    .message {
      border-radius: 12px;
      padding: 12px 14px;
      margin: 0 0 16px;
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .message.error   { background: #fef2f2; border: 1px solid #fecaca; color: var(--danger); }
    .message.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: var(--success); }
    .message.info    { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; }

    .hidden { display: none !important; }

    .loading-area { text-align: center; padding: 28px 12px; }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #dbeafe;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-area p { color: var(--muted); font-size: 14px; line-height: 1.8; margin: 0; }

    .product-heading { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }

    .product-icon {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      border-radius: 16px;
      background: #dbeafe;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .product-heading h2 { margin: 0 0 6px; font-size: 21px; overflow-wrap: anywhere; }
    .product-heading p { color: var(--muted); margin: 0; font-size: 13px; }

    .product-id {
      direction: ltr;
      text-align: right;
      font-family: Arial, sans-serif;
    }

    /* اسم المنتج */
    .product-meta { margin-bottom: 8px; }

    .meta-name {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    /* الأسعار: جنب بعض في صف واحد بخط أصغر */
    #productFields {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      margin: 8px 0 14px;
    }

    .product-field {
      flex: 1 1 0;
      min-width: 0;
      padding: 10px 6px;
      text-align: center;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .product-label {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      margin-bottom: 6px;
    }

    .product-value {
      font-size: 14px;
      line-height: 1.5;
      font-weight: 600;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .product-price { color: var(--success); font-size: 16px; font-weight: 800; }

    @media (max-width: 480px) {
      #productFields { gap: 6px; }
      .product-field { padding: 8px 4px; border-radius: 10px; }
      .product-label { font-size: 10px; }
      .product-value { font-size: 12px; }
      .product-price { font-size: 14px; }
    }

    .stock-section { padding: 16px 0 4px; border-top: 1px solid var(--border); margin-top: 4px; }

    /* فلاتر المخزون */
    .stock-filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 8px 0 12px;
    }

    .filter-box label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .filter-box select {
      width: 100%;
      min-height: 44px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background-color: #fff;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      outline: none;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
    }

    .filter-box select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    .stock-table-wrap {
      max-height: 60vh;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .stock-table { width: 100%; border-collapse: collapse; font-size: 13px; }

    .stock-table th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      text-align: right;
      padding: 10px;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .stock-table td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .stock-table tbody tr:last-child td { border-bottom: 0; }

    /* صف الإجماليات */
    .stock-table tfoot td {
      position: sticky;
      bottom: 0;
      background: #eff6ff;
      border-top: 2px solid #bfdbfe;
      border-bottom: 0;
      font-weight: 800;
      color: #1e3a8a;
    }

    /* الاسم واللون ينزلوا سطر تاني لو طالوا، وأعمدة الأرقام تفضل واسعة */
    .stock-name,
    .stock-color {
      white-space: normal;
      overflow-wrap: break-word;
      word-break: normal;
      line-height: 1.5;
    }

    .stock-name { font-weight: 700; max-width: 120px; }
    .stock-color { max-width: 90px; }
    .stock-qty { direction: ltr; text-align: right; font-weight: 700; white-space: nowrap; }

    @media (max-width: 480px) {
      .page { padding: 20px 12px; }
      .card { padding: 21px 17px; }
      .stock-table th, .stock-table td { padding: 8px 6px; }
      .stock-name { max-width: 90px; }
      .stock-color { max-width: 70px; }
    }
  </style>
</head>

<body>
  <main class="page">

    <section id="initialLoading" class="card loading-area">
      <div class="spinner" aria-hidden="true"></div>
      <p>جارٍ التأكد من صلاحيات حسابك...</p>
    </section>

    <section id="loginCard" class="card hidden">
      <div id="emailStep">
        <h2>تسجيل الدخول</h2>
        <p class="description">
          أدخل البريد الإلكتروني المصرح به لتسجيل الدخول.
        </p>

        <div id="loginMessage" class="message hidden" role="status"></div>

        <form id="emailForm">
          <div class="field">
            <label for="emailInput">البريد الإلكتروني</label>
            <input id="emailInput" type="email" autocomplete="email" placeholder="name@example.com" required>
          </div>

          <button id="loginButton" type="submit">دخول</button>
        </form>
      </div>
    </section>

    <section id="productLoading" class="card loading-area hidden">
      <div class="spinner" aria-hidden="true"></div>
      <p>جارٍ التأكد من صلاحيات حسابك وتحميل بيانات المنتج...</p>
    </section>

    <section id="productCard" class="card hidden">
      <div class="product-heading">
        <div class="product-icon" aria-hidden="true">▦</div>
        <div>
          <p>كود المنتج</p>
          <h2 id="productCodeTitle" class="product-id">—</h2>
        </div>
      </div>

      <div id="productMessage" class="message hidden" role="status"></div>

      <!-- اسم المنتج (للصلاحيات اللي بتشوف مخزون) -->
      <div id="productMeta" class="product-meta hidden">
        <div id="metaName" class="meta-name"></div>
      </div>

      <!-- الأسعار حسب الصلاحية (جنب بعض) -->
      <div id="productFields"></div>

      <!-- المخزون -->
      <div id="stockSection" class="stock-section hidden">
        <div class="product-label">المخزون</div>

        <div id="stockMessage" class="message hidden" role="status"></div>

        <div id="stockFilters" class="stock-filters hidden">
          <div class="filter-box">
            <label for="warehouseFilter">المخزن</label>
            <select id="warehouseFilter"></select>
          </div>
          <div class="filter-box">
            <label for="colorFilter">اللون</label>
            <select id="colorFilter"></select>
          </div>
        </div>

        <div id="stockResult" class="stock-table-wrap hidden">
          <table class="stock-table">
            <thead id="stockHead"></thead>
            <tbody id="stockBody"></tbody>
            <tfoot id="stockFoot"></tfoot>
          </table>
        </div>
      </div>

      <button id="scanAnotherButton" type="button" style="margin-top:12px">مسح منتج آخر</button>

      <button id="logoutButton" class="logout-button" type="button" style="margin-top:12px">تسجيل الخروج</button>
    </section>

    <section id="scanCard" class="card hidden">
      <h2>جاهز للمسح</h2>
      <p class="description">اضغط الزر لفتح الكاميرا ومسح QR Code الخاص بالمنتج.</p>

      <button id="startScanButton" type="button">مسح منتج</button>

      <button id="scanLogoutButton" class="logout-button" type="button" style="margin-top:12px">تسجيل الخروج</button>
    </section>
  </main>

  <script>
    'use strict';

    // رابط Apps Script (الـ API فقط) وروابط الصفحات على GitHub.
    const API_URL = 'https://script.google.com/macros/s/AKfycbzfbcrBUqJULuQkvgCb_cwc8-VvZl8TyK_ZoFe0MNyN3ZlmOO4QpJEk0_Ly84I7UXUXSQ/exec';
    const HOME_URL = 'https://raiftahmedalaa-tech.github.io/scanner/product.html';
    const SCANNER_URL = 'https://raiftahmedalaa-tech.github.io/scanner/';
    const REQUEST_TIMEOUT_MS = 30000;

    // المتصفح يحتفظ بالتوكن فقط، ولا نخزن البريد الإلكتروني.
    const SESSION_KEY = 'raif_product_session_v1';
    const PRODUCT_ID = (new URLSearchParams(window.location.search).get('id') || '').trim();
    const NOT_SPECIFIED_TEXT = 'غير محدد';
    const FILTER_ALL = '__all__';
    const NO_COLOR_LABEL = 'بدون لون';
    let currentToken = '';
    let busy = false;

    // حالة جدول المخزون الحالي (الفلترة كلها في المتصفح).
    let stockState = { rows: [], split: false, wholesale: false };

    /**
     * يرسل الطلب للـ API. نستخدم text/plain عشان المتصفح ما يعملش طلب preflight.
     */
    function callServer(action, args, onSuccess, onFailure) {
      const controller = new AbortController();
      const timer = window.setTimeout(function() { controller.abort(); }, REQUEST_TIMEOUT_MS);

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, args: args }),
        signal: controller.signal
      })
        .then(function(response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        })
        .then(
          function(data) { window.clearTimeout(timer); onSuccess(data); },
          function(error) { window.clearTimeout(timer); onFailure(error); }
        );
    }

    document.addEventListener('DOMContentLoaded', initializePage);

    document.getElementById('emailForm').addEventListener('submit', function(event) {
      event.preventDefault();
      handleLogin();
    });

    document.getElementById('logoutButton').addEventListener('click', handleLogout);
    document.getElementById('scanAnotherButton').addEventListener('click', openScanner);
    document.getElementById('startScanButton').addEventListener('click', openScanner);
    document.getElementById('scanLogoutButton').addEventListener('click', handleLogout);

    document.getElementById('warehouseFilter').addEventListener('change', applyStockFilters);
    document.getElementById('colorFilter').addEventListener('change', applyStockFilters);

    // لو الصفحة رجعت من الكاش بزرار الرجوع، نرجّع أزرار المسح لحالتها.
    window.addEventListener('pageshow', function(event) {
      if (!event.persisted) return;

      ['scanAnotherButton', 'startScanButton'].forEach(function(id) {
        const button = document.getElementById(id);
        if (!button) return;
        button.disabled = false;
        button.textContent = id === 'scanAnotherButton' ? 'مسح منتج آخر' : 'مسح منتج';
      });
    });

    /**
     * - لو فيه منتج في الرابط: نطلب المنتج مباشرة (getProduct بتتحقق من الجلسة والصلاحية).
     * - لو مفيش: نتحقق من الجلسة ونعرض شاشة المسح.
     */
    function initializePage() {
      const saved = getLocalSession();

      if (!saved.token) {
        showLogin();
        return;
      }

      currentToken = saved.token;

      if (PRODUCT_ID) {
        hide('loginCard');
        hide('productCard');
        loadProduct();
        return;
      }

      hide('loginCard');
      hide('productCard');
      hide('productLoading');
      show('initialLoading');

      callServer(
        'validateSession',
        [currentToken],
        function(result) {
          hide('initialLoading');

          if (result && result.ok) {
            enterApp();
            return;
          }

          handleSessionFailure(result || { code: 'SESSION_INVALID' });
        },
        function(error) {
          console.error('Session validation failed:', error);

          // عطل الاتصال لا يعني انتهاء الجلسة: نحتفظ بالتوكن ولا نعرض بيانات.
          hide('initialLoading');
          hide('productCard');
          hide('productLoading');
          clearProductView();
          showLogin();
          showEmailStep();

          showMessage(
            'loginMessage',
            'تعذر الاتصال بالخادم للتحقق من الجلسة. لم يتم عرض بيانات المنتج. حاول مرة أخرى.',
            'error'
          );
        }
      );
    }

    /**
     * تسجيل الدخول بالبريد فقط: لو البريد مصرح في شيت Access يتم إنشاء الجلسة مباشرة.
     */
    function handleLogin() {
      if (busy) return;

      const email = normalizeEmail(document.getElementById('emailInput').value);

      if (!isValidEmail(email)) {
        showMessage('loginMessage', 'اكتب بريدًا إلكترونيًا صحيحًا.', 'error');
        return;
      }

      clearMessage('loginMessage');
      setBusy(true, 'loginButton', 'جارٍ الدخول...');

      callServer(
        'login',
        [email],
        function(result) {
          setBusy(false, 'loginButton', 'دخول');

          if (result && result.ok && result.token) {
            try {
              saveLocalSession(result.token);
            } catch (error) {
              // لا نترك الجلسة نشطة إذا تعذر حفظ التوكن.
              callServer('logout', [result.token], function() {}, function() {});
              clearLocalSession();
              showLogin();

              showMessage(
                'loginMessage',
                'المتصفح منع حفظ الجلسة. فعّل تخزين الموقع ثم حاول مرة أخرى.',
                'error'
              );
              return;
            }

            currentToken = result.token;

            enterApp();
            return;
          }

          showMessage(
            'loginMessage',
            result && result.message ? result.message : 'تعذر تسجيل الدخول. حاول مرة أخرى.',
            'error'
          );
        },
        function(error) {
          console.error('Login failed:', error);
          setBusy(false, 'loginButton', 'دخول');
          showMessage('loginMessage', 'حدث خطأ أثناء الاتصال بالخادم. حاول مرة أخرى.', 'error');
        }
      );
    }

    /**
     * طلب بيانات المنتج بالتوكن فقط. الرد فيه الأسعار والمخزون معًا (طلب واحد).
     */
    function loadProduct() {
      if (!currentToken) {
        clearLocalSession();
        showLogin();
        return;
      }

      hide('productCard');
      hide('initialLoading');
      show('productLoading');

      callServer(
        'getProduct',
        [PRODUCT_ID, currentToken],
        function(result) {
          hide('productLoading');

          if (result && result.ok && result.product) {
            renderProduct(result.product);
            show('productCard');
            return;
          }

          handleProductFailure(result || { code: 'SERVER_ERROR' });
        },
        function(error) {
          console.error('Load product failed:', error);

          hide('productLoading');
          hide('productCard');
          clearProductView();
          showLogin();
          showEmailStep();

          showMessage(
            'loginMessage',
            'تعذر الاتصال بالخادم لتحميل بيانات المنتج. لم يتم عرض بيانات المنتج. حاول مرة أخرى.',
            'error'
          );
        }
      );
    }

    /**
     * الحقول القادمة من السيرفر هي المسموحة فقط.
     * نستخدم textContent لمنع تفسير بيانات الشيت على أنها HTML.
     */
    function renderProduct(product) {
      clearProductView();

      document.getElementById('productCodeTitle').textContent = product.code || '—';

      const container = document.getElementById('productFields');
      const fields = Array.isArray(product.fields) ? product.fields : [];

      fields.forEach(function(field) {
        const wrapper = document.createElement('div');
        wrapper.className = 'product-field';

        const label = document.createElement('div');
        label.className = 'product-label';
        label.textContent = field.label || '';

        const value = document.createElement('div');
        value.className = 'product-value' + (field.kind === 'price' ? ' product-price' : '');

        value.textContent =
          field.value === '' || field.value === null || field.value === undefined
            ? NOT_SPECIFIED_TEXT
            : String(field.value);

        wrapper.appendChild(label);
        wrapper.appendChild(value);
        container.appendChild(wrapper);
      });

      clearMessage('productMessage');

      if (product.canViewStock) {
        renderStock(product.stock);
      }
    }

    function formatQuantity(value) {
      const n = Number(value);

      return value !== null && value !== undefined && Number.isFinite(n)
        ? n.toLocaleString('en-US', { maximumFractionDigits: 3 })
        : '—';
    }

    function addCell(tr, text, className, tag, colSpan) {
      const cell = document.createElement(tag || 'td');
      if (className) cell.className = className;
      if (colSpan) cell.colSpan = colSpan;
      cell.textContent = text;
      tr.appendChild(cell);
    }

    function colorKey(color) {
      return String(color || '').trim().toLowerCase();
    }

    function colorLabel(color) {
      const value = String(color || '').trim();
      return value || NO_COLOR_LABEL;
    }

    function renderStock(stock) {
      if (!stock) return;

      show('stockSection');

      if (stock.ok === false) {
        showMessage('stockMessage', stock.message || 'تعذر جلب المخزون حاليًا.', 'error');
        return;
      }

      if (stock.productName) {
        document.getElementById('metaName').textContent = stock.productName;
        show('productMeta');
      }

      const rows = Array.isArray(stock.rows) ? stock.rows : [];

      if (rows.length === 0) {
        showMessage('stockMessage', stock.message || 'غير متوفر في المخازن.', 'info');
        return;
      }

      stockState = {
        rows: rows,
        split: stock.hasSplit === true,
        wholesale: stock.hasWholesale === true
      };

      // رؤوس الجدول (ثابتة طول ما المنتج ظاهر).
      const head = document.getElementById('stockHead');
      head.replaceChildren();

      const headRow = document.createElement('tr');
      (stockState.split
        ? (stockState.wholesale
            ? ['المخزن', 'اللون', 'قطاعي', 'تجاري', 'الجملة', 'الإجمالي']
            : ['المخزن', 'اللون', 'قطاعي', 'تجاري', 'الإجمالي'])
        : ['المخزن', 'اللون', 'الكمية'])
        .forEach(function(label) { addCell(headRow, label, '', 'th'); });
      head.appendChild(headRow);

      // الفلاتر تبدأ على "الكل".
      document.getElementById('warehouseFilter').value = FILTER_ALL;
      document.getElementById('colorFilter').value = FILTER_ALL;

      applyStockFilters();

      show('stockFilters');
      show('stockResult');
    }

    function fillSelect(select, items, selected, allLabel) {
      select.replaceChildren();

      const all = document.createElement('option');
      all.value = FILTER_ALL;
      all.textContent = allLabel;
      select.appendChild(all);

      items.forEach(function(item) {
        const option = document.createElement('option');
        option.value = item.value;
        option.textContent = item.label;
        select.appendChild(option);
      });

      const exists = selected === FILTER_ALL || items.some(function(item) { return item.value === selected; });
      select.value = exists ? selected : FILTER_ALL;
    }

    /**
     * يطبق الفلاتر على الصفوف المخزنة في المتصفح:
     * - قائمة المخازن بتعرض بس المخازن اللي فيها اللون المختار.
     * - قائمة الألوان بتعرض بس الألوان اللي في المخزن المختار.
     * - الجدول والإجماليات بيتحدثوا حسب الاختيار.
     */
    function applyStockFilters() {
      const whSelect = document.getElementById('warehouseFilter');
      const colorSelect = document.getElementById('colorFilter');

      let wh = whSelect.value || FILTER_ALL;
      let color = colorSelect.value || FILTER_ALL;

      const rows = stockState.rows;

      const warehouses = [];
      const colors = [];
      const seenWh = {};
      const seenColor = {};

      rows.forEach(function(row) {
        const key = colorKey(row.color);

        if (color === FILTER_ALL || key === color) {
          if (!seenWh[row.warehouse]) {
            seenWh[row.warehouse] = true;
            warehouses.push({ value: row.warehouse, label: row.warehouse || '—' });
          }
        }

        if (wh === FILTER_ALL || row.warehouse === wh) {
          if (!seenColor[key]) {
            seenColor[key] = true;
            colors.push({ value: key, label: colorLabel(row.color) });
          }
        }
      });

      fillSelect(whSelect, warehouses, wh, 'كل المخازن');
      fillSelect(colorSelect, colors, color, 'كل الألوان');

      wh = whSelect.value;
      color = colorSelect.value;

      const visible = rows.filter(function(row) {
        return (wh === FILTER_ALL || row.warehouse === wh) &&
          (color === FILTER_ALL || colorKey(row.color) === color);
      });

      renderStockRows(visible);
    }

    function renderStockRows(rows) {
      const split = stockState.split;
      const body = document.getElementById('stockBody');
      const foot = document.getElementById('stockFoot');

      body.replaceChildren();
      foot.replaceChildren();

      let sumRetail = 0;
      let sumCommercial = 0;
      let sumWholesale = 0;
      let sumTotal = 0;
      const showWholesale = stockState.wholesale;

      const fragment = document.createDocumentFragment();

      rows.forEach(function(row) {
        const tr = document.createElement('tr');

        addCell(tr, row.warehouse || '—', 'stock-name');
        addCell(tr, row.color || '—', 'stock-color');

        if (split) {
          const isSplitRow = row.total !== null && row.total !== undefined;
          const total = isSplitRow ? row.total : row.quantity;

          addCell(tr, isSplitRow ? formatQuantity(row.retail) : '—', 'stock-qty');
          addCell(tr, isSplitRow ? formatQuantity(row.commercial) : '—', 'stock-qty');

          if (showWholesale) {
            addCell(tr, formatQuantity(row.wholesale), 'stock-qty');
          }

          addCell(tr, formatQuantity(total), 'stock-qty');

          sumRetail += Number(row.retail) || 0;
          sumCommercial += Number(row.commercial) || 0;
          sumWholesale += Number(row.wholesale) || 0;
          sumTotal += Number(total) || 0;
        } else {
          addCell(tr, formatQuantity(row.quantity), 'stock-qty');
          sumTotal += Number(row.quantity) || 0;
        }

        fragment.appendChild(tr);
      });

      body.appendChild(fragment);

      // صف الإجماليات (حسب الصفوف الظاهرة بعد الفلتر).
      const totalRow = document.createElement('tr');
      addCell(totalRow, 'الإجمالي', '', 'td', 2);

      if (split) {
        addCell(totalRow, formatQuantity(sumRetail), 'stock-qty');
        addCell(totalRow, formatQuantity(sumCommercial), 'stock-qty');

        if (showWholesale) {
          addCell(totalRow, formatQuantity(sumWholesale), 'stock-qty');
        }

        addCell(totalRow, formatQuantity(sumTotal), 'stock-qty');
      } else {
        addCell(totalRow, formatQuantity(sumTotal), 'stock-qty');
      }

      foot.appendChild(totalRow);
    }

    function clearProductView() {
      hide('productMeta');
      hide('stockSection');
      hide('stockResult');
      hide('stockFilters');
      clearMessage('stockMessage');

      stockState = { rows: [], split: false, wholesale: false };

      document.getElementById('metaName').textContent = '';
      document.getElementById('stockHead').replaceChildren();
      document.getElementById('stockBody').replaceChildren();
      document.getElementById('stockFoot').replaceChildren();
      document.getElementById('warehouseFilter').replaceChildren();
      document.getElementById('colorFilter').replaceChildren();
      document.getElementById('productCodeTitle').textContent = '—';
      document.getElementById('productFields').replaceChildren();
    }

    function handleSessionFailure(result) {
      hide('initialLoading');
      hide('productLoading');
      hide('productCard');
      clearProductView();

      const code = result && result.code;
      const message = result && result.message ? result.message : 'تعذر التحقق من الجلسة.';

      if (code === 'SERVER_ERROR') {
        // مشكلة مؤقتة: احتفظ بالتوكن ولا تعرض المنتج.
        showLogin();
        showEmailStep();
        showMessage('loginMessage', message, 'error');
        return;
      }

      clearLocalSession();
      showLogin();
      showEmailStep();
      showMessage('loginMessage', message, 'error');
    }

    function handleProductFailure(result) {
      hide('productLoading');
      hide('productCard');
      clearProductView();

      const code = result && result.code;
      const message = result && result.message ? result.message : 'تعذر تحميل بيانات المنتج.';

      if (code === 'SESSION_INVALID' || code === 'NOT_AUTHORIZED' || code === 'ROLE_NOT_DEFINED') {
        clearLocalSession();
        showLogin();
        showEmailStep();
        showMessage('loginMessage', message, 'error');
        return;
      }

      if (code === 'PRODUCT_NOT_FOUND' || code === 'PRODUCT_DUPLICATE') {
        show('productCard');
        showMessage('productMessage', message, 'error');
        return;
      }

      // لا نمسح التوكن عند حدوث خطأ مؤقت في الخادم.
      showLogin();
      showEmailStep();
      showMessage('loginMessage', message, 'error');
    }

    function openScanner(event) {
      const button = event && event.currentTarget ? event.currentTarget : null;

      if (button) {
        button.disabled = true;
        button.textContent = 'جارٍ فتح الاسكان...';
      }

      window.location.href = SCANNER_URL;
    }

    function showScanStart() {
      hide('initialLoading');
      hide('loginCard');
      hide('productLoading');
      hide('productCard');
      show('scanCard');
    }

    function enterApp() {
      if (!PRODUCT_ID) {
        showScanStart();
        return;
      }

      showProduct();
      loadProduct();
    }

    function goToMainPage() {
      window.location.replace(HOME_URL);
    }

    function handleLogout() {
      if (busy) return;

      const tokenToRevoke = currentToken;

      clearLocalSession();
      clearProductView();
      showLogin();
      showEmailStep();
      clearMessage('loginMessage');

      if (!tokenToRevoke) {
        goToMainPage();
        return;
      }

      callServer(
        'logout',
        [tokenToRevoke],
        function() {
          showMessage('loginMessage', 'تم تسجيل الخروج.', 'success');
          goToMainPage();
        },
        function(error) {
          console.error('Server logout failed:', error);

          showMessage(
            'loginMessage',
            'تم مسح التوكن من هذا المتصفح، لكن تعذر تأكيد إلغاء الجلسة على الخادم بسبب مشكلة الاتصال.',
            'error'
          );
        }
      );
    }

    // حفظ التوكن فقط (لا نحفظ البريد).
    function saveLocalSession(token) {
      localStorage.setItem(SESSION_KEY, token);
    }

    function getLocalSession() {
      try {
        return { token: localStorage.getItem(SESSION_KEY) || '' };
      } catch (error) {
        return { token: '' };
      }
    }

    function clearLocalSession() {
      try {
        localStorage.removeItem(SESSION_KEY);
      } catch (error) {
        console.error('Could not clear local session.');
      }

      currentToken = '';
    }

    function showLogin() {
      hide('initialLoading');
      hide('productLoading');
      hide('productCard');
      hide('scanCard');
      show('loginCard');
    }

    function showProduct() {
      hide('initialLoading');
      hide('loginCard');
      hide('productLoading');
      hide('scanCard');
      show('productCard');
    }

    function showEmailStep() {
      show('loginCard');
      show('emailStep');
    }

    function show(id) { document.getElementById(id).classList.remove('hidden'); }
    function hide(id) { document.getElementById(id).classList.add('hidden'); }

    function showMessage(id, message, type) {
      const element = document.getElementById(id);

      element.textContent = message || '';
      element.className = 'message ' + (type || 'info');
      element.classList.remove('hidden');
    }

    function clearMessage(id) {
      const element = document.getElementById(id);

      element.textContent = '';
      element.className = 'message hidden';
    }

    function setBusy(isBusy, buttonId, buttonText) {
      busy = isBusy;

      const button = document.getElementById(buttonId);

      if (button) {
        button.disabled = isBusy;
        button.textContent = buttonText;
      }
    }

    function normalizeEmail(email) {
      return String(email || '').trim().toLowerCase();
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || ''));
    }
  </script>
</body>
</html>
