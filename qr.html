<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>طباعة QR Code</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root {
      --primary:#2563eb; --primary-dark:#1d4ed8; --bg:#f3f6fb; --text:#172033; --muted:#64748b; --border:#e2e8f0; --ok:#15803d; --err:#b91c1c;

      /* مقاس الاستيكر: عدّل من هنا بس */
      --label-w: 50mm;
      --label-h: 24mm;
      --qr-size: 14mm;
      --id-font: 9pt;
      --text-w: 46mm;   /* عرض صورة النص (46 مم = 368 نقطة على 203dpi) */
      --text-h: 4.5mm;  /* ارتفاع صورة النص (4.5 مم = 36 نقطة) */
      --shift-up: 2mm; /* ارفع المحتوى لفوق: زوّدها لو عايز أكتر */
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:Tahoma,Arial,sans-serif; }
    .page { max-width:720px; margin:0 auto; padding:24px 14px; }
    .card { background:#fff; border:1px solid var(--border); border-radius:18px; padding:22px; margin-bottom:14px; box-shadow:0 12px 35px rgba(15,23,42,.06); }
    h1 { text-align:center; font-size:23px; margin:0 0 18px; }
    h2 { font-size:18px; margin:0 0 10px; }
    .hint { color:var(--muted); font-size:13px; line-height:1.9; margin:0 0 14px; }
    label.title { display:block; font-size:14px; font-weight:700; margin-bottom:8px; }
    input[type=file] { width:100%; min-height:48px; border:1px solid #cbd5e1; border-radius:12px; padding:12px 14px; font-size:16px; font-family:inherit; background:#fff; margin-bottom:12px; }
    button { width:100%; min-height:48px; border:0; border-radius:12px; background:var(--primary); color:#fff; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; padding:12px 16px; }
    button:hover { background:var(--primary-dark); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    button.secondary { background:#fff; color:var(--primary); border:1px solid #bfdbfe; margin-bottom:14px; }
    button.secondary:hover { background:#eff6ff; }
    .message { border-radius:12px; padding:12px 14px; margin:0 0 14px; font-size:13px; line-height:1.9; overflow-wrap:anywhere; }
    .message.error { background:#fef2f2; border:1px solid #fecaca; color:var(--err); }
    .message.success { background:#f0fdf4; border:1px solid #bbf7d0; color:var(--ok); }
    .message.info { background:#eff6ff; border:1px solid #bfdbfe; color:#1d4ed8; }
    ul.errors { margin:8px 0 0; padding:0 18px; max-height:260px; overflow-y:auto; }
    .hidden { display:none !important; }

    .list-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
    .check-all { display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; cursor:pointer; }
    .count { color:var(--muted); font-size:13px; }
    .codes { max-height:55vh; overflow-y:auto; border:1px solid var(--border); border-radius:12px; padding:10px; display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:8px; margin-bottom:14px; }
    .code-item { display:flex; align-items:center; gap:8px; padding:8px 10px; background:#f8fafc; border:1px solid var(--border); border-radius:10px; cursor:pointer; font-size:13px; }
    .code-item:hover { background:#eff6ff; }
    .code-text { display:flex; flex-direction:column; gap:2px; min-width:0; }
    .code-text .c { direction:ltr; text-align:right; font-family:Arial,sans-serif; font-weight:700; overflow-wrap:anywhere; }
    .code-text .n { font-size:12px; color:var(--muted); overflow-wrap:anywhere; line-height:1.5; }
    input[type=checkbox] { width:18px; height:18px; flex-shrink:0; cursor:pointer; }

    /* الاستيكرات: تظهر عند الطباعة فقط. المقاس من المتغيرات فوق (50 × 25 مم) */
    #labels { display:none; }
    .label { width:var(--label-w); height:var(--label-h); overflow:hidden; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0.5mm 1mm calc(0.5mm + var(--shift-up) * 2); gap:0.3mm; text-align:center; break-inside:avoid; page-break-inside:avoid; }
    .qr { display:block; width:var(--qr-size); height:var(--qr-size); flex:0 0 var(--qr-size); object-fit:contain; }
    .code-img { display:block; width:var(--text-w); height:var(--text-h); flex:0 0 var(--text-h); image-rendering:pixelated; image-rendering:crisp-edges; }
    .product-id { width:100%; max-height:5mm; overflow:hidden; direction:ltr; font-family:'Arial Black',Arial,sans-serif; font-size:var(--id-font); font-weight:900; letter-spacing:0.4mm; line-height:1.1; overflow-wrap:anywhere; }

    @page { size: 50mm 25mm; margin: 0; }

    @media print {
      html, body { display:block !important; width:var(--label-w) !important; min-width:0 !important; margin:0 !important; padding:0 !important; background:#fff !important; }
      .no-print { display:none !important; }
      #labels { display:block !important; width:var(--label-w) !important; margin:0 !important; padding:0 !important; }
      .label { width:var(--label-w) !important; height:var(--label-h) !important; margin:0 !important; padding:0.5mm 1mm calc(0.5mm + var(--shift-up) * 2) !important; border:0 !important; border-radius:0 !important; box-shadow:none !important; overflow:hidden !important; break-after:page; page-break-after:always; break-inside:avoid; page-break-inside:avoid; }
      .label:last-child { break-after:auto; page-break-after:auto; }
      .qr { width:var(--qr-size) !important; height:var(--qr-size) !important; }
      .product-id { font-size:var(--id-font) !important; }
      .code-img { width:var(--text-w) !important; height:var(--text-h) !important; }
    }
  </style>
</head>
<body>
<main class="page no-print">
  <h1>طباعة QR Code</h1>

  <section id="uploadCard" class="card">
    <h2>رفع ملف Excel</h2>
    <p class="hint">
      الملف لازم يحتوي على شيت اسمه <b dir="ltr">QRCode</b> وفيه العمودين:
      <b dir="ltr">ProductCode</b> و <b dir="ltr">ProductName</b>.
      الـ ProductCode إجباري في كل صف، واسم المنتج لو فاضي بيتطبع الكود لوحده.
      أي أعمدة زيادة بتتجاهل، والصفوف الفاضية بتتجاهل.
    </p>

    <button id="templateButton" type="button" class="secondary">Download Template</button>

    <label class="title" for="fileInput">ملف Excel</label>
    <input id="fileInput" type="file" accept=".xlsx,.xls">

    <div id="message" class="message hidden" role="status" aria-live="polite"></div>
  </section>

  <section id="listCard" class="card hidden">
    <h2>اختر المنتجات للطباعة</h2>

    <div class="list-head">
      <label class="check-all"><input type="checkbox" id="selectAll"> تحديد الكل</label>
      <span class="count" id="count"></span>
    </div>

    <div id="codesList" class="codes"></div>

    <div id="printMessage" class="message hidden" role="status" aria-live="polite"></div>

    <button id="printButton" type="button" class="hidden">Print QRCode</button>
  </section>
</main>

<!-- محتوى الاستيكرات (للطباعة فقط) -->
<div id="labels"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
  'use strict';

  const SHEET_NAME = 'QRCode';
  const HEADER_CODE = 'ProductCode';
  const HEADER_NAME = 'ProductName';
  const PRODUCT_PAGE_URL = 'https://raiftahmedalaa-tech.github.io/scanner/product.html';
  const MAX_ERRORS_SHOWN = 60;

  // إعدادات الـ QR: تصحيح أخطاء M، وهامش أبيض 2 وحدة (كافي للمسح، ويخلي المربعات أكبر على استيكر صغير).
  const QR_ERROR_LEVEL = 'M';
  const QR_MARGIN_MODULES = 2;

  // كل عنصر: { code, name }
  let items = [];
  let printing = false;

  const $ = function(id) { return document.getElementById(id); };

  function show(id) { $(id).classList.remove('hidden'); }
  function hide(id) { $(id).classList.add('hidden'); }

  function showMessage(id, text, type, list) {
    const el = $(id);
    el.className = 'message ' + (type || 'info');
    el.textContent = text || '';

    if (Array.isArray(list) && list.length) {
      const ul = document.createElement('ul');
      ul.className = 'errors';

      list.slice(0, MAX_ERRORS_SHOWN).forEach(function(item) {
        const li = document.createElement('li');
        li.textContent = item;
        ul.appendChild(li);
      });

      if (list.length > MAX_ERRORS_SHOWN) {
        const li = document.createElement('li');
        li.textContent = 'و ' + (list.length - MAX_ERRORS_SHOWN) + ' أخطاء أخرى...';
        ul.appendChild(li);
      }

      el.appendChild(ul);
    }
  }

  function clearMessage(id) {
    $(id).className = 'message hidden';
    $(id).textContent = '';
  }

  // المقارنة بين أسماء الأعمدة بدون مسافات وبدون حساسية لحالة الأحرف (فـ "Product Code" و "ProductCode" نفس الشيء).
  function norm(value) {
    return String(value === null || value === undefined ? '' : value).trim().toLowerCase().replace(/\s+/g, '');
  }

  function cellText(value) {
    return value === null || value === undefined ? '' : String(value).trim();
  }

  // اسم المنتج: نشيل المسافات الزيادة ونضغط أي أسطر/مسافات متكررة في سطر واحد.
  function cleanName(value) {
    return cellText(value).replace(/\s+/g, ' ');
  }

  /* ---------------- القالب ---------------- */

  $('templateButton').addEventListener('click', function() {
    if (typeof XLSX === 'undefined') {
      showMessage('message', 'تعذر تحميل مكتبة Excel. تأكد من الإنترنت.', 'error');
      return;
    }

    const headers = [HEADER_CODE, HEADER_NAME];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet([headers]);
    ws['!cols'] = [{ wch: 24 }, { wch: 36 }];
    XLSX.utils.book_append_sheet(wb, ws, SHEET_NAME);

    XLSX.writeFile(wb, 'qrcode-template.xlsx');
  });

  /* ---------------- قراءة الملف والتحقق ---------------- */

  function parseWorkbook(wb) {
    const actual = wb.SheetNames.find(function(n) {
      return n.trim().toLowerCase() === SHEET_NAME.toLowerCase();
    });

    if (!actual) {
      return { errors: ['الشيت "' + SHEET_NAME + '" غير موجود في الملف.'], items: [] };
    }

    const ws = wb.Sheets[actual];
    const ref = ws['!ref'];

    if (!ref) {
      return { errors: ['الشيت "' + SHEET_NAME + '" فاضي.'], items: [] };
    }

    const startRow = XLSX.utils.decode_range(ref).s.r;
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: true });

    const headerRow = aoa[0] || [];
    const codeCol = headerRow.findIndex(function(c) { return norm(c) === norm(HEADER_CODE); });
    const nameCol = headerRow.findIndex(function(c) { return norm(c) === norm(HEADER_NAME); });

    const missing = [];
    if (codeCol === -1) missing.push(HEADER_CODE);
    if (nameCol === -1) missing.push(HEADER_NAME);

    if (missing.length) {
      return { errors: ['الشيت "' + SHEET_NAME + '" ناقصه الأعمدة: ' + missing.join('، ')], items: [] };
    }

    const errors = [];
    const result = [];
    const seen = {};

    for (let i = 1; i < aoa.length; i++) {
      const row = aoa[i] || [];
      const code = cellText(row[codeCol]);
      const name = cleanName(row[nameCol]);
      const rowNo = startRow + i + 1;

      if (!code && !name) continue;

      if (!code) {
        errors.push('الصف ' + rowNo + ': ProductCode فاضي (اسم المنتج "' + name + '").');
        continue;
      }

      const key = code.toLowerCase();

      if (seen[key]) {
        errors.push('الصف ' + rowNo + ': الكود "' + code + '" مكرر (الصف ' + seen[key] + ').');
        continue;
      }

      seen[key] = rowNo;
      result.push({ code: code, name: name });
    }

    if (errors.length === 0 && result.length === 0) {
      errors.push('الشيت "' + SHEET_NAME + '" مفيهوش أكواد منتجات.');
    }

    return { errors: errors, items: result };
  }

  $('fileInput').addEventListener('change', function() {
    items = [];
    hide('listCard');
    clearMessage('message');
    clearMessage('printMessage');

    const file = $('fileInput').files[0];
    if (!file) return;

    if (typeof XLSX === 'undefined') {
      showMessage('message', 'تعذر تحميل مكتبة Excel. تأكد من الإنترنت.', 'error');
      return;
    }

    showMessage('message', 'جارٍ فحص الملف...', 'info');

    file.arrayBuffer()
      .then(function(buffer) {
        const wb = XLSX.read(buffer, { type: 'array' });
        const result = parseWorkbook(wb);

        if (result.errors.length) {
          showMessage('message', 'الملف فيه مشاكل ولم يتم قبوله (' + result.errors.length + '):', 'error', result.errors);
          return;
        }

        items = result.items;

        const noName = items.filter(function(it) { return !it.name; }).length;
        let text = 'الملف سليم. تم العثور على ' + items.length + ' كود.';
        if (noName > 0) text += ' (' + noName + ' منتج بدون اسم: هيتطبع الكود فقط)';

        showMessage('message', text, 'success');
        renderList();
      })
      .catch(function() {
        showMessage('message', 'تعذر قراءة الملف. تأكد إنه ملف Excel سليم.', 'error');
      });
  });

  /* ---------------- قائمة الاختيار ---------------- */

  function renderList() {
    const list = $('codesList');
    list.replaceChildren();

    const fragment = document.createDocumentFragment();

    items.forEach(function(item, i) {
      const row = document.createElement('label');
      row.className = 'code-item';

      const box = document.createElement('input');
      box.type = 'checkbox';
      box.dataset.index = String(i);

      const text = document.createElement('div');
      text.className = 'code-text';

      const c = document.createElement('span');
      c.className = 'c';
      c.textContent = item.code;
      text.appendChild(c);

      if (item.name) {
        const n = document.createElement('span');
        n.className = 'n';
        n.textContent = item.name;
        text.appendChild(n);
      }

      row.appendChild(box);
      row.appendChild(text);
      fragment.appendChild(row);
    });

    list.appendChild(fragment);
    $('selectAll').checked = false;
    $('selectAll').indeterminate = false;

    updateSelection();
    show('listCard');
  }

  function checkboxes() {
    return Array.from($('codesList').querySelectorAll('input[type=checkbox]'));
  }

  function selectedItems() {
    return checkboxes()
      .filter(function(box) { return box.checked; })
      .map(function(box) { return items[Number(box.dataset.index)]; });
  }

  function updateSelection() {
    const boxes = checkboxes();
    const selected = boxes.filter(function(box) { return box.checked; }).length;

    $('count').textContent = 'المحدد: ' + selected + ' من ' + boxes.length;
    $('selectAll').checked = boxes.length > 0 && selected === boxes.length;
    $('selectAll').indeterminate = selected > 0 && selected < boxes.length;

    const button = $('printButton');
    button.textContent = 'طباعة QRCode (' + selected + ')';

    if (selected > 0) show('printButton'); else hide('printButton');
  }

  $('selectAll').addEventListener('change', function() {
    const checked = $('selectAll').checked;

    checkboxes().forEach(function(box) { box.checked = checked; });
    updateSelection();
  });

  $('codesList').addEventListener('change', updateSelection);

  /* ---------------- توليد الـ QR محليًا ---------------- */

  /**
   * يولّد QR كصورة SVG (data URI) من غير أي طلب شبكة:
   * أكواد المنتجات ما بتخرجش من المتصفح، والـ SVG بيتطبع حاد على أي مقاس.
   * (الـ QR بيحتوي رابط الكود فقط، اسم المنتج للعرض على الاستيكر بس.)
   */
  function makeQrDataUrl(text) {
    const qr = qrcode(0, QR_ERROR_LEVEL); // 0 = اختيار الإصدار تلقائيًا حسب طول النص
    qr.addData(text);
    qr.make();

    const count = qr.getModuleCount();
    const size = count + QR_MARGIN_MODULES * 2;
    let path = '';

    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) {
          path += 'M' + (c + QR_MARGIN_MODULES) + ',' + (r + QR_MARGIN_MODULES) + 'h1v1h-1z';
        }
      }
    }

    const svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="' + (size * 10) + '" height="' + (size * 10) + '" viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="crispEdges">' +
      '<rect width="100%" height="100%" fill="#fff"/>' +
      '<path d="' + path + '" fill="#000"/>' +
      '</svg>';

    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  /**
   * يرسم سطر النص على الاستيكر كصورة أبيض/أسود بدقة الطابعة (203dpi) بالظبط،
   * فيتطبع بنفس النقط من غير ما الـ driver يعيد رسم الخط ويقطّعه.
   *
   * الشكل:  اسم المنتج (كود المنتج)
   * - اسم المنتج بخط أكبر، والكود بخط أصغر (النسبة ثابتة NAME_TO_CODE_RATIO).
   * - الخطين بيصغروا مع بعض بنفس النسبة لحد ما السطر يتساع في العرض.
   * - لو الاسم طويل جدًا حتى بأصغر خط، بيتقص بـ "…" (الكود بيفضل كامل دايمًا).
   * - لو مفيش اسم: الكود لوحده بخطه الكبير الأصلي.
   */
  const PRINTER_DPI = 203;
  const TEXT_W_MM = 46;
  const TEXT_H_MM = 4.5;

  const FONT_FAMILY = 'Arial, Tahoma, Helvetica, sans-serif';
  const NAME_START_PX = 28;      // أكبر خط للاسم (بالنقط)
  const NAME_MIN_PX = 15;        // أصغر خط للاسم قبل ما نبدأ نقص الاسم
  const NAME_TO_CODE_RATIO = 0.72; // خط الكود = خط الاسم × النسبة دي
  const CODE_ONLY_START_PX = 26; // خط الكود لو مفيش اسم
  const CODE_ONLY_MIN_PX = 12;
  const SIDE_PAD_PX = 3;

  function makeTextDataUrl(name, code) {
    const dots = PRINTER_DPI / 25.4;
    const w = Math.round(TEXT_W_MM * dots);   // 368
    const h = Math.round(TEXT_H_MM * dots);   // 36
    const maxW = w - SIDE_PAD_PX * 2;

    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;

    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = '#000';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    if ('direction' in ctx) ctx.direction = 'ltr';

    function setFont(px, spacing) {
      ctx.font = 'bold ' + px + 'px ' + FONT_FAMILY;
      if ('letterSpacing' in ctx) ctx.letterSpacing = spacing + 'px';
    }

    function widthOf(text, px, spacing) {
      setFont(px, spacing);
      return ctx.measureText(text).width;
    }

    let namePx, codePx, nameText, codeText, gap;

    if (!name) {
      // الكود لوحده: نفس السلوك القديم (أكبر خط يناسب العرض).
      nameText = '';
      codeText = code;
      gap = 0;
      codePx = CODE_ONLY_START_PX;
      namePx = codePx;

      while (codePx > CODE_ONLY_MIN_PX && widthOf(codeText, codePx, 2) > maxW) codePx--;
      namePx = codePx;
    } else {
      nameText = name;
      codeText = '(' + code + ')';

      namePx = NAME_START_PX;
      codePx = Math.round(namePx * NAME_TO_CODE_RATIO);

      // المسافة بين الاسم والكود بحجم مسافة بخط الكود.
      const totalWidth = function() {
        return widthOf(nameText, namePx, 1) + Math.round(codePx * 0.45) + widthOf(codeText, codePx, 1.5);
      };

      while (namePx > NAME_MIN_PX) {
        codePx = Math.round(namePx * NAME_TO_CODE_RATIO);
        if (totalWidth() <= maxW) break;
        namePx--;
      }

      codePx = Math.round(namePx * NAME_TO_CODE_RATIO);

      // لسه مش متساع بأصغر خط: نقص الاسم بـ "…".
      if (totalWidth() > maxW) {
        let chars = Array.from(nameText);

        while (chars.length > 1) {
          chars.pop();
          nameText = chars.join('').trim() + '\u2026';
          if (totalWidth() <= maxW) break;
        }
      }

      gap = Math.round(codePx * 0.45);
    }

    // نحسب العرض الكلي ونوسّط السطر أفقيًا.
    const nameSpacing = name ? 1 : 2;
    const codeSpacing = name ? 1.5 : 2;
    const nameW = nameText ? widthOf(nameText, namePx, nameSpacing) : 0;
    const codeW = widthOf(codeText, codePx, codeSpacing);
    const total = nameW + gap + codeW;
    let x = Math.max(SIDE_PAD_PX, Math.round((w - total) / 2));

    // خط أساس مشترك للاثنين: الاسم (الأكبر) متوسّط رأسيًا، والكود على نفس الخط.
    const baseline = Math.round(h / 2 + namePx * 0.35);

    if (nameText) {
      setFont(namePx, nameSpacing);
      ctx.fillText(nameText, x, baseline);
      x += nameW + gap;
    }

    setFont(codePx, codeSpacing);
    ctx.fillText(codeText, x, baseline);

    // تحويل لأبيض وأسود صافي (من غير رمادي) علشان الحواف تطلع حادة
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = d[i] < 150 ? 0 : 255;
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);

    return canvas.toDataURL('image/png');
  }

  /* ---------------- الطباعة ---------------- */

  function buildLabels(selected) {
    if (typeof qrcode === 'undefined') {
      throw new Error('تعذر تحميل مكتبة الـ QR. تأكد من الإنترنت ثم أعد تحميل الصفحة.');
    }

    const container = $('labels');
    container.replaceChildren();

    const fragment = document.createDocumentFragment();

    selected.forEach(function(item) {
      const code = item.code;
      const name = item.name;
      const productUrl = PRODUCT_PAGE_URL + '?id=' + encodeURIComponent(code);

      let dataUrl;

      try {
        dataUrl = makeQrDataUrl(productUrl);
      } catch (error) {
        throw new Error('تعذر توليد QR للمنتج ' + code + ' (الكود طويل جدًا؟).');
      }

      const label = document.createElement('article');
      label.className = 'label';

      const qr = document.createElement('img');
      qr.className = 'qr';
      qr.alt = '';
      qr.src = dataUrl;

      let id;

      try {
        id = document.createElement('img');
        id.className = 'code-img';
        id.alt = name ? name + ' (' + code + ')' : code;
        id.src = makeTextDataUrl(name, code);
      } catch (error) {
        // لو الصورة فشلت نرجع للنص العادي
        id = document.createElement('div');
        id.className = 'product-id';
        id.textContent = name ? name + ' (' + code + ')' : code;
      }

      // محتويات الاستيكر: QR Code + (Product Name + Product Code).
      label.appendChild(qr);
      label.appendChild(id);
      fragment.appendChild(label);
    });

    container.appendChild(fragment);
  }

  // الصور data URI فبتتحمل فورًا تقريبًا، بس نستنى للتأكد قبل ما نفتح نافذة الطباعة.
  function waitForImages() {
    const images = Array.from($('labels').querySelectorAll('img'));

    return Promise.all(images.map(function(img) {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve();

      return new Promise(function(resolve, reject) {
        img.addEventListener('load', resolve, { once: true });
        img.addEventListener('error', function() {
          reject(new Error('تعذر تجهيز صورة الاستيكر.'));
        }, { once: true });
      });
    }));
  }

  $('printButton').addEventListener('click', async function() {
    if (printing) return;

    const selected = selectedItems();
    if (selected.length === 0) return;

    printing = true;
    $('printButton').disabled = true;
    $('printButton').textContent = 'جارٍ تجهيز الطباعة...';
    showMessage('printMessage', 'جارٍ تجهيز ' + selected.length + ' QR...', 'info');

    try {
      buildLabels(selected);
      await waitForImages();

      clearMessage('printMessage');
      window.print();
    } catch (error) {
      showMessage('printMessage', error && error.message ? error.message : 'تعذر تجهيز الطباعة.', 'error');
    } finally {
      printing = false;
      $('printButton').disabled = false;
      updateSelection();
    }
  });
</script>
